name: Build and Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HonKit and Plugins
        run: |
          npm install honkit --global
          # 如果有 package.json，先安装本地依赖
          if [ -f "package.json" ]; then npm install; fi
          # 如果有 book.json 且使用了插件，可安装 honkit 插件扩展工具进行插件补全
          if [ -f "book.json" ]; then npx honkit-plugin-cli install || true; fi

      - name: Build GitBook
        run: honkit build

      - name: Deploy to gh-pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
