name: Build and Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HonKit and Book Plugins Locally
        run: |
          # 1. 在本地项目根目录安装 honkit
          npm install honkit --save-dev

          # 2. 自动读取 book.json 并在本地安装所有插件
          node -e '
            const fs = require("fs");
            if (fs.existsSync("book.json")) {
              const book = JSON.parse(fs.readFileSync("book.json", "utf8"));
              const plugins = book.plugins || [];
              const pkgs = plugins
                .filter(p => typeof p === "string" && !p.startsWith("-"))
                .map(p => p.startsWith("gitbook-plugin-") || p.startsWith("honkit-plugin-") ? p : "gitbook-plugin-" + p);
              if (pkgs.length > 0) {
                console.log("正在本地安装插件:", pkgs.join(" "));
                require("child_process").execSync("npm install " + pkgs.join(" ") + " --save-dev", { stdio: "inherit" });
              }
            }
          '

      - name: Build GitBook
        run: npx honkit build # 👈 使用 npx 触发本地 honkit 执行，确保能加载本地 node_modules 里的插件

      - name: Deploy to gh-pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
