name: Build and Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 👈 改用 Node 20

      - name: Install HonKit
        run: |
          npm install honkit --global
          if [ -f "book.json" ]; then honkit install; fi

      - name: Build GitBook
        run: honkit build

      - name: Deploy to gh-pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
