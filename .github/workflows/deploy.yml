name: Build and Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HonKit & Auto-Install Plugins
        run: |
          # 1. 全局安装 HonKit
          npm install -g honkit

          # 2. 读取 book.json 动态安装所有 gitbook 插件
          node -e '
            const fs = require("fs");
            if (fs.existsSync("book.json")) {
              const book = JSON.parse(fs.readFileSync("book.json", "utf8"));
              const plugins = book.plugins || [];
              const pkgs = plugins
                .filter(p => typeof p === "string" && !p.startsWith("-"))
                .map(p => "gitbook-plugin-" + p);
              if (pkgs.length > 0) {
                console.log("正在自动安装插件:", pkgs.join(" "));
                require("child_process").execSync("npm install " + pkgs.join(" ") + " --save-dev", { stdio: "inherit" });
              }
            }
          '

      - name: Build GitBook
        run: honkit build

      - name: Deploy to gh-pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
