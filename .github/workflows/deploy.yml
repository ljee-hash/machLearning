name: Deploy GitBook to GitHub Pages

on:
  push:
    branches: [ "master" ]

# 设置写入权限，允许 GitHub Actions 向仓库推送 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HonKit and Book Plugins
        run: |
          # 1. 本地安装 HonKit 编译内核
          npm install honkit --save-dev

          # 2. 自动解析 book.json 并本地安装所有依赖插件
          node -e '
            const fs = require("fs");
            if (fs.existsSync("book.json")) {
              const book = JSON.parse(fs.readFileSync("book.json", "utf8"));
              const plugins = book.plugins || [];
              const pkgs = plugins
                .filter(p => typeof p === "string" && !p.startsWith("-"))
                .map(p => p.startsWith("gitbook-plugin-") || p.startsWith("honkit-plugin-") ? p : "gitbook-plugin-" + p);
              if (pkgs.length > 0) {
                console.log("正在安装 GitBook 插件:", pkgs.join(" "));
                require("child_process").execSync("npm install " + pkgs.join(" ") + " --save-dev", { stdio: "inherit" });
              }
            }
          '

      - name: Auto Generate SUMMARY.md from Directory Structure
        - name: Auto Generate SUMMARY.md from Directory Structure
        run: |
          # 自动递归扫描目录并使用智能多级数字排序生成精确定制的 SUMMARY.md
          node -e '
            const fs = require("fs");
            const path = require("path");

            const IGNORE_DIRS = ["node_modules", "_book", ".git", ".github"];

            // 定义一级目录的显示先后顺序权重
            const chapterOrder = {
              "install": 1,
              "chapter1": 2,
              "chapter2": 3,
              "chapter3": 4,
              "chapter4": 5,
              "chapter5": 6,
              "chapter6": 7,
              "chapter7": 8,
              "chapter8": 9,
              "advanced": 10
            };

            function getTitle(filePath) {
              try {
                const content = fs.readFileSync(filePath, "utf8");
                const match = content.match(/^#\s+(.+)$/m);
                if (match) return match[1].trim();
              } catch (e) {}
              const basename = path.basename(filePath, ".md");
              return basename.charAt(0).toUpperCase() + basename.slice(1);
            }

            // 增强版智能数字/版本号排序函数（完美解决 5.1.2 和 5.1.17 的排序错乱问题）
            function smartCompare(aName, bName) {
              // 提取字符串中的所有数字片段进行逐段比较
              const getParts = (str) => str.split(/(\d+)/).map(v => /^\d+$/.test(v) ? parseInt(v, 10) : v);
              const partsA = getParts(aName);
              const partsB = getParts(bName);

              const len = Math.max(partsA.length, partsB.length);
              for (let i = 0; i < len; i++) {
                if (partsA[i] === undefined) return -1;
                if (partsB[i] === undefined) return 1;

                if (typeof partsA[i] === "number" && typeof partsB[i] === "number") {
                  if (partsA[i] !== partsB[i]) {
                    return partsA[i] - partsB[i];
                  }
                } else {
                  const res = String(partsA[i]).localeCompare(String(partsB[i]), undefined, { sensitivity: "base" });
                  if (res !== 0) return res;
                }
              }
              return 0;
            }

            function generateSummary(dir, depth = 0) {
              let lines = [];
              const indent = "    ".repeat(depth);
              const items = fs.readdirSync(dir, { withFileTypes: true });

              // 智能排序
              items.sort((a, b) => {
                if (depth === 0) {
                  const orderA = chapterOrder[a.name] !== undefined ? chapterOrder[a.name] : 999;
                  const orderB = chapterOrder[b.name] !== undefined ? chapterOrder[b.name] : 999;
                  if (orderA !== orderB) {
                    return orderA - orderB;
                  }
                }
                return smartCompare(a.name, b.name);
              });

              for (const item of items) {
                if (item.name.startsWith(".")) continue;
                const fullPath = path.join(dir, item.name);

                if (item.isDirectory()) {
                  if (IGNORE_DIRS.includes(item.name)) continue;
                  
                  const readmePath = path.join(fullPath, "README.md");
                  const title = fs.existsSync(readmePath) ? getTitle(readmePath) : item.name;
                  const relPath = fs.existsSync(readmePath) ? path.relative(".", readmePath) : "";

                  if (relPath) {
                    lines.push(`${indent}* [${title}](${relPath})`);
                  } else {
                    lines.push(`${indent}* ${item.name}`);
                  }
                  lines = lines.concat(generateSummary(fullPath, depth + 1));
                } else if (item.isFile() && item.name.endsWith(".md")) {
                  if (item.name.toUpperCase() === "SUMMARY.MD") continue;
                  if (depth === 0 && item.name.toUpperCase() === "README.MD") continue; 
                  if (depth > 0 && item.name.toUpperCase() === "README.MD") continue;  

                  const relPath = path.relative(".", fullPath);
                  const title = getTitle(fullPath);
                  lines.push(`${indent}* [${title}](${relPath})`);
                }
              }
              return lines;
            }

            let summaryContent = "# Summary\n\n";
            if (fs.existsSync("README.md")) {
              summaryContent += `* [前言](README.md)\n\n`;
            }

            const navLines = generateSummary(".");
            summaryContent += navLines.join("\n") + "\n";

            fs.writeFileSync("SUMMARY.md", summaryContent, "utf8");
            console.log("成功自动更新并按智能多级数字排序的 SUMMARY.md！");
          '

      - name: Fix LaTeX & Nunjucks Template Conflict
        run: |
          # 自动遍历所有 .md 文件，将包含大括号 {} 的 LaTeX 公式块包裹上 {% raw %}，防止模板引擎报错
          node -e '
            const fs = require("fs");
            const path = require("path");

            function fixMarkdownFiles(dir) {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const fullPath = path.join(dir, file);
                const stat = fs.statSync(fullPath);

                if (stat.isDirectory()) {
                  if (file !== "node_modules" && file !== "_book" && !file.startsWith(".")) {
                    fixMarkdownFiles(fullPath);
                  }
                } else if (file.endsWith(".md")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  let updated = content.replace(/(\$\$[\s\S]*?\$\$|\$[^$\n]+\$)/g, (match) => {
                    if (match.includes("{") && !match.includes("{% raw %}")) {
                      return "{% raw %}" + match + "{% endraw %}";
                    }
                    return match;
                  });

                  if (updated !== content) {
                    fs.writeFileSync(fullPath, updated, "utf8");
                  }
                }
              }
            }

            fixMarkdownFiles(".");
          '

      - name: Build GitBook
        run: npx honkit build

      - name: Deploy to gh-pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
