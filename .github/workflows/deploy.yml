name: Deploy GitBook to GitHub Pages

on:
  push:
    branches: [ "master" ]

# 设置写入权限，允许 GitHub Actions 向仓库推送 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HonKit and Book Plugins
        run: |
          # 1. 本地安装 HonKit 编译内核
          npm install honkit --save-dev

          # 2. 自动解析 book.json 并本地安装所有依赖插件
          node -e '
            const fs = require("fs");
            if (fs.existsSync("book.json")) {
              const book = JSON.parse(fs.readFileSync("book.json", "utf8"));
              const plugins = book.plugins || [];
              const pkgs = plugins
                .filter(p => typeof p === "string" && !p.startsWith("-"))
                .map(p => p.startsWith("gitbook-plugin-") || p.startsWith("honkit-plugin-") ? p : "gitbook-plugin-" + p);
              if (pkgs.length > 0) {
                console.log("正在安装 GitBook 插件:", pkgs.join(" "));
                require("child_process").execSync("npm install " + pkgs.join(" ") + " --save-dev", { stdio: "inherit" });
              }
            }
          '

      - name: Fix LaTeX & Nunjucks Template Conflict
        run: |
          # 自动遍历所有 .md 文件，将包含大括号 {} 的 LaTeX 公式块包裹上 {% raw %}，防止模板引擎报错
          node -e '
            const fs = require("fs");
            const path = require("path");

            function fixMarkdownFiles(dir) {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const fullPath = path.join(dir, file);
                const stat = fs.statSync(fullPath);

                if (stat.isDirectory()) {
                  if (file !== "node_modules" && file !== "_book" && !file.startsWith(".")) {
                    fixMarkdownFiles(fullPath);
                  }
                } else if (file.endsWith(".md")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  let updated = content.replace(/(\$\$[\s\S]*?\$\$|\$[^$\n]+\$)/g, (match) => {
                    if (match.includes("{") && !match.includes("{% raw %}")) {
                      return "{% raw %}" + match + "{% endraw %}";
                    }
                    return match;
                  });

                  if (updated !== content) {
                    fs.writeFileSync(fullPath, updated, "utf8");
                  }
                }
              }
            }

            fixMarkdownFiles(".");
          '

      - name: Build GitBook
        run: npx honkit build

      - name: Deploy to gh-pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
