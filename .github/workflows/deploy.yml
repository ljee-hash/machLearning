name: Build and Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HonKit and Book Plugins
        run: |
          # 1. 全局安装 HonKit 及插件 CLI 工具
          npm install -g honkit honkit-plugin-cli
          
          # 2. 如果存在 package.json 则安装项目本地依赖
          if [ -f "package.json" ]; then npm install; fi
          
          # 3. 自动根据 book.json 补全安装缺失的 gitbook 插件
          if [ -f "book.json" ]; then npx honkit-plugin-cli install; fi

      - name: Build GitBook
        run: honkit build

      - name: Deploy to gh-pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
